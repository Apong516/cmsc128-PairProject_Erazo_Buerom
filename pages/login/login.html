<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Login</title>
  <link rel="stylesheet" href="./login.css" />
</head>
<body>
  <div class="auth-shell">
    <!-- LEFT: blue welcome panel --->
    <aside class="hero-left">
      <div class="hero-content">
        <h1 class="welcome">WELCOME</h1>
        <h2 class="headline">TASKDASH TO-DO LIST</h2>
      </div>
      <div class="blob blob-1"></div>
      <div class="blob blob-2"></div>
      <div class="blob blob-3"></div>
    </aside>

    <!-- RIGHT: white auth card -->
    <main class="auth-card">
      <!-- LOGIN -->
      <section id="panel-login" class="panel">
        <h2 class="title">Sign in</h2>
        <p class="muted small">Use your <b>email</b> or <b>username</b> and password.</p>

        <form id="loginForm" class="form">
          <!-- GROUP: username/email -->
          <div class="input-group">
            <label class="field">
              <span class="icon">👤</span>
              <input id="loginId" placeholder="Email or Username" required />
            </label>
            <p id="loginUserError" class="msg error"></p>
          </div>

          <!-- GROUP: password -->
          <div class="input-group">
            <label class="field">
              <span class="icon">🔒</span>
              <input id="loginPassword" type="password" placeholder="Password" required />
              <button type="button" id="toggleLoginPw" class="show">SHOW</button>
            </label>
            <p id="loginPassError" class="msg error"></p>
          </div>

          <div class="row-between">
            <label class="check">
              <input type="checkbox" checked />
              <span>Remember me</span>
            </label>
            <button id="forgotBtn" class="link link-forgot" type="button" aria-controls="panel-recover" aria-expanded="false">Forgot Password?</button>
          </div>

          <button class="btn primary wide" type="submit">Sign in</button>

          <p class="muted tiny center">
            Don’t have an account? <a class="link link-signup" href="../signup/signup.html">Sign up</a>
          </p>
          <p id="loginMsg" class="msg"></p>
        </form>
      </section>

      <!-- RECOVER -->
      <section id="panel-recover" class="panel hidden">
        <h2 class="title">Password recovery</h2>
        <form id="recoverForm" class="form">
          <input id="recoverEmail" type="email" placeholder="Your email" required />
          <button class="btn warning wide" type="submit">Send reset link</button>
          <p id="recoverMsg" class="msg"></p>
          <p class="muted tiny center">
            <button class="link link-login" type="button" aria-controls="panel-login">Back to sign in</button>
          </p>
        </form>
      </section>
    </main>
  </div>
  <script type="module" src="./login.js"></script>
</body>
</html>
