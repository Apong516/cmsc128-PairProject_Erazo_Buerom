<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>TaskDash — Sign up</title>
  <link rel="stylesheet" href="/signup/signup.css" />
</head>
<body class="auth">
  <main class="auth-card" role="main" aria-labelledby="title">
    <div class="brand">
      <div></div><strong>TaskDash</strong>
    </div>

    <h1 id="title">Create account</h1>
    <p>Make an account to save your tasks.</p>

    <form id="signupForm" novalidate>
      <label>
        <span>Name</span>
        <input id="name" required />
        <small class="field-msg" id="nameMsg"></small>
      </label>

      <label>
        <span>Email</span>
        <input id="email" type="email" autocomplete="email" required />
        <small class="field-msg" id="emailMsg"></small>
      </label>

      <label>
        <span>Password</span>
        <input id="password" type="password" autocomplete="new-password" minlength="6" required />
        <!-- strength meter -->
        <div class="strength" aria-live="polite">
          <div class="strength-bar">
            <div class="strength-fill" id="strengthFill"></div>
          </div>
          <span class="strength-label" id="strengthLabel">Too short</span>
        </div>
        <small class="field-msg" id="passMsg"></small>
      </label>

      <label>
        <span>Confirm password</span>
        <input id="confirm" type="password" autocomplete="new-password" required />
        <small class="field-msg" id="confirmMsg"></small>
      </label>

      <button class="primary" id="submitBtn" type="submit" disabled>Sign up</button>
    </form>

  <p class="have-account">Already have an account? <a href="../login/login.html">Log in</a></p>
    <p id="msg" class="error" aria-live="polite"></p>
  </main>

  <script type="module" src="/signup/signup.js"></script>
</body>
</html>
