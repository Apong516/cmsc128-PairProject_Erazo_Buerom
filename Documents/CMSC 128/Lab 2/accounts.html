<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Lab 2 – Accounts (Firebase)</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="auth-shell">
    <!-- LEFT: blue welcome panel -->
    <aside class="hero-left">
      <div class="hero-content">
        <h1 class="welcome">WELCOME</h1>
        <h2 class="headline">TASKDASH TO-DO LIST</h2>
      </div>
      <div class="blob blob-1"></div>
      <div class="blob blob-2"></div>
      <div class="blob blob-3"></div>
    </aside>

    <!-- RIGHT: white auth card -->
    <main class="auth-card">
      <!-- NOTE: Removed the "Signed in as" banner block -->

      <!-- LOGIN -->
      <section id="panel-login" class="panel">
        <h2 class="title">Sign in</h2>
        <p class="muted small">Use your <b>email</b> or <b>username</b> and password.</p>

        <form id="loginForm" class="form">
          <!-- GROUP: username/email -->
          <div class="input-group">
            <label class="field">
              <span class="icon">👤</span>
              <input id="loginId" placeholder="Email or Username" required />
            </label>
            <p id="loginUserError" class="msg error"></p>
          </div>

          <!-- GROUP: password -->
          <div class="input-group">
            <label class="field">
              <span class="icon">🔒</span>
              <input id="loginPassword" type="password" placeholder="Password" required />
              <button type="button" id="toggleLoginPw" class="show">SHOW</button>
            </label>
            <p id="loginPassError" class="msg error"></p>
          </div>

          <div class="row-between">
            <label class="check">
              <input type="checkbox" checked />
              <span>Remember me</span>
            </label>
            <a class="link link-forgot">Forgot Password?</a>
          </div>

          <button class="btn primary wide" type="submit">Sign in</button>

          <p class="muted tiny center">
            Don’t have an account? <a class="link link-signup">Sign up</a>
          </p>
          <p id="loginMsg" class="msg"></p>
        </form>
      </section>

      <!-- SIGN UP -->
      <section id="panel-signup" class="panel hidden">
        <h2 class="title">Create account</h2>
        <form id="signupForm" class="form">
          <div class="grid two">
            <input id="signupName" placeholder="Name" required />
            <input id="signupUsername" placeholder="Username" required />
          </div>
          <div class="grid two">
            <input id="signupEmail" type="email" placeholder="Email" required />
            <input id="signupPassword" type="password" placeholder="Password" minlength="6" required />
          </div>
          <button class="btn success wide" type="submit">Sign up</button>
          <p id="signupMsg" class="msg"></p>
          <p class="muted tiny center">Already have an account? <a class="link link-login">Sign in</a></p>
        </form>
      </section>

      <!-- RECOVER -->
      <section id="panel-recover" class="panel hidden">
        <h2 class="title">Password recovery</h2>
        <form id="recoverForm" class="form">
          <input id="recoverEmail" type="email" placeholder="Your email" required />
          <button class="btn warning wide" type="submit">Send reset link</button>
          <p id="recoverMsg" class="msg"></p>
          <p class="muted tiny center"><a class="link link-login">Back to sign in</a></p>
        </form>
      </section>
    </main>
  </div>

  <script type="module" src="./app.js"></script>
  <script>
    // --- UI extras ---
    const pw = document.getElementById('loginPassword');
    document.getElementById('toggleLoginPw').onclick = () => {
      const isPw = pw.type === 'password';
      pw.type = isPw ? 'text' : 'password';
      document.getElementById('toggleLoginPw').textContent = isPw ? 'HIDE' : 'SHOW';
    };

    // Smooth switching between forms
    const panels = {
      login: document.getElementById('panel-login'),
      signup: document.getElementById('panel-signup'),
      recover: document.getElementById('panel-recover'),
    };
    function showTab(name) {
      Object.values(panels).forEach(p => p.classList.add('hidden'));
      panels[name].classList.remove('hidden');
    }
    document.querySelector('.link-forgot').onclick = ()=>showTab('recover');
    document.querySelector('.link-signup').onclick = ()=>showTab('signup');
    document.querySelectorAll('.link-login').forEach(a=>a.onclick=()=>showTab('login'));
  </script>
</body>
</html>
