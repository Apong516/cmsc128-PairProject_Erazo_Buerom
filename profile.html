<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Profile – Lab 2 Accounts</title>
  <link rel="stylesheet" href="./profile.css" />
</head>

<body>
  <!-- sidebar -->
  <aside class="sidebar">
    <div class="user-block">
      <div class="avatar" id="userInitial">?</div>
      <h2 id="welcomeName">Welcome, User</h2>
    </div>
    <div class="nav">
      <a href="#" class="active">Profile</a>
      <a href="#">Settings</a>
      <a href="#" id="btnLogout">Log Out</a>
    </div>
  </aside>

  <!-- main content -->
  <main class="main">
    <section class="section">
      <h1>Profile Information</h1>
      <div class="grid-two">
        <div>
          <label for="profileName">Name</label>
          <input id="profileName" placeholder="Your name" />
        </div>
        <div>
          <label for="profileUsername">Username</label>
          <input id="profileUsername" placeholder="Your username" />
        </div>
      </div>

      <label for="profileEmail">Email</label>
      <input id="profileEmail" type="email" disabled />

      <button id="btnSaveProfile" class="btn-save">Save Changes</button>
      <p id="profileMsg" class="msg"></p>
    </section>

    <section class="section">
      <h1>Change Password</h1>
      <div class="grid-two">
        <div>
          <label for="currentPassword">Current Password</label>
          <input id="currentPassword" type="password" />
        </div>
        <div>
          <label for="newPassword">New Password</label>
          <input id="newPassword" type="password" minlength="6" />
        </div>
      </div>

      <label for="confirmPassword">Confirm New Password</label>
      <input id="confirmPassword" type="password" minlength="6" />

      <button id="btnChangePassword" class="btn-save">Update Password</button>
      <p id="passwordMsg" class="msg"></p>
    </section>
  </main>

  <script type="module" src="./profile.js"></script>
</body>
</html>
